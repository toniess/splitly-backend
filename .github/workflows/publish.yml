name: Сборка и публикация образа

on:
  push:
    branches: [main]
  # Позволяет запустить выкладку вручную из вкладки Actions,
  # не делая пустой коммит
  workflow_dispatch:

concurrency:
  # Если пуши идут один за другим, незавершённую сборку предыдущего нет смысла
  # доводить до конца — в реестр всё равно поедет последняя
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Gradle с кешем
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers поднимает PostgreSQL в Docker — на ubuntu-latest он есть
      # из коробки, ставить ничего не нужно
      - name: Прогон тестов
        run: ./gradlew test --no-daemon

      - name: Отчёты о тестах
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/
          retention-days: 7

  publish:
    name: Образ в Artifact Registry
    needs: test
    runs-on: ubuntu-latest
    # Отправка в реестр однажды подвисла на 42 минуты без единой строки
    # в логе. Лучше упасть по таймауту, чем жечь время раннера впустую.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # По умолчанию checkout берёт один коммит, и HEAD~1 не существует.
          # Предыдущий коммит нужен, чтобы вычислить тег прошлого образа.
          fetch-depth: 2

      - name: Проверка настроек репозитория
        env:
          REGISTRY: ${{ vars.CLOUDRU_REGISTRY }}
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          KEY_SECRET: ${{ secrets.CLOUDRU_KEY_SECRET }}
        run: |
          miss=""
          [ -n "$REGISTRY" ]   || miss="$miss vars.CLOUDRU_REGISTRY"
          [ -n "$KEY_ID" ]     || miss="$miss secrets.CLOUDRU_KEY_ID"
          [ -n "$KEY_SECRET" ] || miss="$miss secrets.CLOUDRU_KEY_SECRET"
          if [ -n "$miss" ]; then
            echo "::error::Не заданы:$miss — см. deploy/README.md"
            exit 1
          fi

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Вход в реестр
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CLOUDRU_REGISTRY }}
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}

      - name: Теги образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.CLOUDRU_REGISTRY }}/${{ vars.IMAGE_NAME || 'splitly' }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      # Собираем в локальный демон, НЕ отправляя сразу.
      #
      # buildx общается с реестром сам, в обход docker-демона, и на реестре
      # cloud.ru это намертво зависает: шаг "exporting to image" не выдаёт
      # ни строки прогресса и не завершается. Обычный `docker push` в тот же
      # репозиторий при этом проходит за секунды — проверено вручную.
      - name: Сборка
        uses: docker/build-push-action@v6
        with:
          context: .
          # Облако запускает amd64. Без этой строки на раннере соберётся
          # образ под архитектуру раннера, и на платформе он упадёт
          # с exec format error
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Без этого build-push-action прикладывает к образу provenance-
          # и sbom-манифесты в формате OCI 1.1. Реестры, которые его не
          # поддерживают, на таком манифесте спотыкаются.
          provenance: false
          sbom: false
          # mode=min сохраняет только слои итогового образа.
          #
          # mode=max выгружал бы ещё и промежуточную ступень — JDK, Gradle
          # и весь кеш зависимостей, около гигабайта. Первая такая выгрузка
          # заняла больше двадцати минут, и это дороже, чем те полторы минуты,
          # за которые Gradle заново скачивает зависимости внутри сборки.
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # Реестр cloud.ru отвечает нестабильно: отдельные слои приходится
      # перезапрашивать, а запись манифеста иногда зависает совсем.
      # Поэтому жёсткий лимит на попытку и три захода вместо бесконечного
      # ожидания. Повтор дёшев: уже отправленные слои реестр не принимает
      # заново, остаётся только манифест.
      - name: Отправка в реестр
        run: |
          set -euo pipefail

          push_with_retry() {
            tag="$1"
            for attempt in 1 2 3; do
              echo "==> $tag (попытка $attempt)"
              if timeout 300 docker push "$tag"; then
                return 0
              fi
              echo "не удалось, пауза 20 секунд"
              sleep 20
            done
            echo "::error::не удалось отправить $tag за три попытки"
            return 1
          }

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            push_with_retry "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      # Образ к этому моменту уже опубликован, а чистка реестра — housekeeping.
      # Её сбой не должен красить выкладку в красный: ревизия в Container Apps
      # развернётся в любом случае. Шаг останется видимым как упавший.
      - name: Удаление старых образов
        continue-on-error: true
        env:
          REGISTRY_USERNAME: ${{ secrets.CLOUDRU_KEY_ID }}
          REGISTRY_PASSWORD: ${{ secrets.CLOUDRU_KEY_SECRET }}
        run: |
          # Полный хеш, как в теге type=sha,format=long. Сокращённый вариант
          # пришлось бы подгонять под длину, которую выбирает metadata-action.
          current="sha-${GITHUB_SHA}"
          previous="sha-$(git rev-parse HEAD~1 2>/dev/null || echo отсутствует)"

          echo "оставляем: $current, $previous, latest"
          ./deploy/prune-registry.sh \
              "${{ vars.CLOUDRU_REGISTRY }}" "${{ vars.IMAGE_NAME || 'splitly' }}" \
              "$current" "$previous" latest

      - name: Итог
        run: |
          {
            echo "### Образ опубликован"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Создай ревизию в Container Apps с тегом по хешу коммита."
          } >> "$GITHUB_STEP_SUMMARY"
