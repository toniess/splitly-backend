name: Сборка и публикация образа

on:
  push:
    branches: [main]
  workflow_dispatch:

# Прогоны идут строго по очереди: иначе очистка одного могла бы удалить
# образ, который только что залил другой
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers поднимает PostgreSQL в Docker, он на раннере есть
      - run: ./gradlew test --no-daemon

      - name: Отчёты о тестах
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/
          retention-days: 7

  publish:
    name: Образ в Artifact Registry
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ${{ vars.CLOUDRU_REGISTRY }}/splitly
      TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: imjasonh/setup-crane@v0.4

      # С реестром работает только crane. Docker и buildx берут токен
      # POST-запросом к id.cloud.ru, а тот с раннеров GitHub через раз
      # отвечает 502 — отправка зависала без единой строки в логе.
      # crane берёт токен GET-запросом, и у него этой проблемы нет.
      - name: Вход в реестр
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          KEY_SECRET: ${{ secrets.CLOUDRU_KEY_SECRET }}
        run: echo "$KEY_SECRET" | crane auth login "${{ vars.CLOUDRU_REGISTRY }}" -u "$KEY_ID" --password-stdin

      # Поэтому собираем в архив, а не в реестр
      - name: Сборка
        uses: docker/build-push-action@v6
        with:
          context: .
          # Облако запускает amd64
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Отправка
        id: push
        run: |
          # Текущий latest станет предыдущим образом — его оставим для отката
          echo "previous=$(crane digest "$IMAGE:latest" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          timeout 600 crane push /tmp/image.tar "$IMAGE:$TAG"
          crane tag "$IMAGE:$TAG" latest
          echo "current=$(crane digest "$IMAGE:$TAG")" >> "$GITHUB_OUTPUT"

      # В реестре остаются текущий и предыдущий образ, остальные удаляются.
      # Сравнение по дайджестам: удаление по дайджесту снимает все теги
      # образа. Сбой очистки не валит выкладку — образ уже опубликован.
      - name: Очистка реестра
        continue-on-error: true
        env:
          CURRENT: ${{ steps.push.outputs.current }}
          PREVIOUS: ${{ steps.push.outputs.previous }}
        run: |
          # Без дайджеста нового образа удалилось бы и оно
          [ -n "$CURRENT" ] || { echo "::error::неизвестен дайджест нового образа"; exit 1; }
          for tag in $(crane ls "$IMAGE"); do
            digest=$(crane digest "$IMAGE:$tag")
            if [ "$digest" != "$CURRENT" ] && [ "$digest" != "$PREVIOUS" ]; then
              echo "$digest"
            fi
          done | sort -u | while read -r digest; do
            echo "удаляю $digest"
            crane delete "$IMAGE@$digest"
          done

      - name: Итог
        run: echo "Опубликовано \`$IMAGE:$TAG\` и \`latest\`" >> "$GITHUB_STEP_SUMMARY"
