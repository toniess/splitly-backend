name: Сборка и публикация образа

on:
  push:
    branches: [main]
  # Позволяет запустить выкладку вручную из вкладки Actions,
  # не делая пустой коммит
  workflow_dispatch:

concurrency:
  # Если пуши идут один за другим, незавершённую сборку предыдущего нет смысла
  # доводить до конца — в реестр всё равно поедет последняя
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Gradle с кешем
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers поднимает PostgreSQL в Docker — на ubuntu-latest он есть
      # из коробки, ставить ничего не нужно
      - name: Прогон тестов
        run: ./gradlew test --no-daemon

      - name: Отчёты о тестах
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/
          retention-days: 7

  publish:
    name: Образ в Artifact Registry
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # По умолчанию checkout берёт один коммит, и HEAD~1 не существует.
          # Предыдущий коммит нужен, чтобы вычислить тег прошлого образа.
          fetch-depth: 2

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Вход в реестр
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CLOUDRU_REGISTRY }}
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}

      - name: Теги образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.CLOUDRU_REGISTRY }}/splitly
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Сборка и отправка
        uses: docker/build-push-action@v6
        with:
          context: .
          # Облако запускает amd64. Без этой строки на раннере соберётся
          # образ под архитектуру раннера, и на платформе он упадёт
          # с exec format error
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кеш слоёв между запусками: иначе Gradle качает зависимости заново
          # при каждой сборке
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Удаление старых образов
        env:
          REGISTRY_USERNAME: ${{ secrets.CLOUDRU_KEY_ID }}
          REGISTRY_PASSWORD: ${{ secrets.CLOUDRU_KEY_SECRET }}
        run: |
          # Ровно семь символов от полного хеша: так же, как это делает
          # metadata-action для тега type=sha. git rev-parse --short при
          # коллизии вернул бы больше, и тег не совпал бы.
          current="sha-${GITHUB_SHA:0:7}"

          previous_full="$(git rev-parse HEAD~1 2>/dev/null || true)"
          previous="sha-${previous_full:0:7}"

          echo "оставляем: $current, ${previous}, latest"
          ./deploy/prune-registry.sh \
              "${{ vars.CLOUDRU_REGISTRY }}" splitly \
              "$current" "$previous" latest

      - name: Итог
        run: |
          {
            echo "### Образ опубликован"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Создай ревизию в Container Apps с тегом по хешу коммита."
          } >> "$GITHUB_STEP_SUMMARY"
