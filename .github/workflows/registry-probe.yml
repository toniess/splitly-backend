########################################################################
#  Диагностика: умеет ли раннер GitHub вообще публиковать образы
#  в реестр cloud.ru.
#
#  С машины разработчика публикуются и большие, и многослойные образы.
#  С раннера запись манифеста не завершается никогда, хотя слои уходят
#  полностью. Этот workflow берёт заведомо рабочие чужие образы и пробует
#  отправить их именно с раннера — чтобы отделить «виноват наш образ»
#  от «виноват путь Azure → cloud.ru».
#
#  Запускается вручную: Actions → Диагностика реестра → Run workflow.
#  Удалить, когда разберёмся.
########################################################################

name: Диагностика реестра

on:
  workflow_dispatch:

jobs:
  probe:
    name: Публикация чужих образов с раннера
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Вход в реестр
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CLOUDRU_REGISTRY }}
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}

      # Один слой, 13 МБ. С Mac проходил за секунду.
      - name: Крошечный образ
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 alpine:3.21
          docker tag alpine:3.21 ${{ vars.CLOUDRU_REGISTRY }}/probe-runner-tiny:v1
          timeout 120 docker push ${{ vars.CLOUDRU_REGISTRY }}/probe-runner-tiny:v1

      # Пять слоёв, 200 МБ. С Mac тоже проходил.
      - name: Большой многослойный образ
        if: always()
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 eclipse-temurin:21-jre-alpine
          docker tag eclipse-temurin:21-jre-alpine ${{ vars.CLOUDRU_REGISTRY }}/probe-runner-jre:v1
          timeout 300 docker push ${{ vars.CLOUDRU_REGISTRY }}/probe-runner-jre:v1

      - name: Итог
        if: always()
        run: |
          {
            echo "### Что это значит"
            echo
            echo "- оба шага зелёные — раннер публиковать умеет, дело в нашем образе"
            echo "- оба упали по таймауту — путь Azure → cloud.ru не пропускает запись манифеста"
            echo "- упал только большой — ограничение по размеру на стороне сети"
          } >> "$GITHUB_STEP_SUMMARY"
