########################################################################
#  Диагностика: умеет ли раннер GitHub вообще публиковать образы
#  в реестр cloud.ru.
#
#  С машины разработчика публикуются и большие, и многослойные образы.
#  С раннера запись манифеста не завершается никогда, хотя слои уходят
#  полностью. Этот workflow берёт заведомо рабочие чужие образы и пробует
#  отправить их именно с раннера — чтобы отделить «виноват наш образ»
#  от «виноват путь Azure → cloud.ru».
#
#  Запускается вручную: Actions → Диагностика реестра → Run workflow.
#  Удалить, когда разберёмся.
########################################################################

name: Диагностика реестра

on:
  workflow_dispatch:

jobs:
  probe:
    name: Публикация чужих образов с раннера
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Вход в реестр
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CLOUDRU_REGISTRY }}
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}

      # Один слой, 13 МБ. С Mac проходил за секунду.
      - name: Крошечный образ
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 alpine:3.21
          docker tag alpine:3.21 ${{ vars.CLOUDRU_REGISTRY }}/probe-runner-tiny:v1
          timeout 120 docker push ${{ vars.CLOUDRU_REGISTRY }}/probe-runner-tiny:v1

      # Пять слоёв, 200 МБ. С Mac тоже проходил.
      - name: Большой многослойный образ
        if: always()
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 eclipse-temurin:21-jre-alpine
          docker tag eclipse-temurin:21-jre-alpine ${{ vars.CLOUDRU_REGISTRY }}/probe-runner-jre:v1
          timeout 300 docker push ${{ vars.CLOUDRU_REGISTRY }}/probe-runner-jre:v1

      # Шаг выше ничего не загружает: все слои JRE уже лежат в реестре после
      # пробы с Mac, и docker отвечает «Layer already exists». Настоящая
      # загрузка с раннера — только здесь. Случайные байты не сжимаются,
      # как и jar-файлы, и каждый прогон дают новый блоб.
      #
      # 27 МБ — столько meridian-web заливает с раннера каждый раз без проблем.
      # 64 МБ — размер нашего слоя с библиотеками.
      - name: Новые блобы 27 и 64 МБ
        if: always()
        run: |
          set -euo pipefail
          for mb in 27 64; do
            dir=$(mktemp -d)
            head -c "${mb}M" /dev/urandom > "$dir/blob"
            printf 'FROM scratch\nCOPY blob /blob\n' > "$dir/Dockerfile"
            tag=${{ vars.CLOUDRU_REGISTRY }}/probe-runner-random:${mb}mb-${{ github.run_id }}
            docker build -q -t "$tag" "$dir"
            echo "==> ${mb} МБ"
            start=$(date +%s)
            timeout 300 docker push "$tag"
            echo "    за $(( $(date +%s) - start )) с"
          done

      # Собран здесь же, обычным сборщиком docker.
      - name: Образ, собранный на раннере (драйвер docker)
        if: always()
        run: |
          set -euo pipefail
          printf 'FROM eclipse-temurin:21-jre-alpine\nRUN echo hi > /hi.txt\n' > /tmp/D1
          docker build --platform linux/amd64 \
              -t ${{ vars.CLOUDRU_REGISTRY }}/probe-runner-built:v1 -f /tmp/D1 /tmp
          timeout 180 docker push ${{ vars.CLOUDRU_REGISTRY }}/probe-runner-built:v1

      # То же самое, но сборщиком docker-container — как в основном пайплайне.
      - name: buildx
        if: always()
        uses: docker/setup-buildx-action@v3

      - name: Образ, собранный buildx (драйвер docker-container)
        if: always()
        run: |
          set -euo pipefail
          printf 'FROM eclipse-temurin:21-jre-alpine\nRUN echo hi2 > /hi2.txt\n' > /tmp/D2
          docker buildx build --platform linux/amd64 --load \
              --provenance=false --sbom=false \
              -t ${{ vars.CLOUDRU_REGISTRY }}/probe-runner-buildx:v1 -f /tmp/D2 /tmp
          timeout 180 docker push ${{ vars.CLOUDRU_REGISTRY }}/probe-runner-buildx:v1

      - name: Итог
        if: always()
        run: |
          {
            echo "### Что это значит"
            echo
            echo "- скачанные образы уходят, собранные нет — дело в сборщике"
            echo "- упал только buildx — виноват драйвер docker-container"
            echo "- всё зелёное — дело в нашем Dockerfile, а не в сборке вообще"
          } >> "$GITHUB_STEP_SUMMARY"
