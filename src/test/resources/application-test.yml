spring:
  jpa:
    properties:
      hibernate:
        generate_statistics: true

# Секрет для тестов задан прямо здесь и намеренно не берётся из окружения:
# тесты не должны зависеть от .env, которого в репозитории нет. Раньше они
# брали его оттуда и падали на CI, где файла не существует.
# 64 байта — минимум для HS512.
jwt:
  secret: тестовый-секрет-не-для-прода-тестовый-секрет-не-для-прода-0123456789
  access-ttl: 15m
  refresh-ttl: 30d
