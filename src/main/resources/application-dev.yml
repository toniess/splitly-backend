spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/splitly
    username: splitly
    password: ${POSTGRES_PASSWORD}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

          - env
          - mappings
          - configprops
  endpoint:
    health:
      show-details: always