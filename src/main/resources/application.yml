spring:
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: splitly

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-ttl: 15m
  refresh-ttl: 30d

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info