server:
  # Container Apps задаёт PORT сама и не даёт его переопределить.
  # Локально и в тестах переменной нет — остаётся 8080.
  port: ${PORT:8080}

spring:
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: splitly

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-ttl: 15m
  refresh-ttl: 30d

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
cors:
  # Источники, которым разрешено ходить в API из браузера.
  # На проде задаётся через CORS_ALLOWED_ORIGINS.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

rate-limit:
  login:
    # Двадцать, а не десять: за одним адресом может сидеть офис или мобильный
    # оператор с NAT. Человеку двадцать попыток в минуту недостижимы,
    # а толпу за общим адресом лимит не заденет.
    attempts: 20
    window: 1m
