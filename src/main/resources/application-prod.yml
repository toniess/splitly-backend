logging:
  structured:
    format:
      console: ecs

server:
  # За обратным прокси приложение видит http и адрес контейнера Caddy.
  # Без этой настройки в ссылках окажется http://app:8080 вместо
  # https://api.toniess.dev, а в логах — внутренний IP вместо клиентского.
  forward-headers-strategy: framework

spring:
  datasource:
    # Логин и пароль — параметрами в самой строке:
    #   jdbc:postgresql://host/db?user=...&password=...&sslmode=require
    # Отдельные SPRING_DATASOURCE_USERNAME и _PASSWORD тоже сработают:
    # Spring подхватывает их из окружения сам.
    url: ${SPRING_DATASOURCE_URL}
    hikari:
      # Neon на бесплатном тарифе засыпает после простоя:
      # первое соединение ждёт, пока база проснётся.
      connection-timeout: 30000
      maximum-pool-size: 10
      # Соединение, провисевшее дольше паузы Neon, уже мертво — не держим его долго
      max-lifetime: 300000
      idle-timeout: 120000

management:
  endpoint:
    health:
      # Отдельные эндпоинты /actuator/health/liveness и /readiness.
      # Платформе для liveness-пробы нужен именно liveness: он проверяет,
      # жив ли процесс, и не ходит в базу. Общий /actuator/health включает
      # проверку Neon — спящая база выглядела бы как мёртвое приложение,
      # и платформа перезапускала бы контейнер по кругу.
      probes:
        enabled: true
